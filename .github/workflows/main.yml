name: Update Site Log

on:
  push:
    branches: [main]

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # Activity 1: get the latest code onto the runner
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Show who pushed
        run: echo "Pushed by ${{ github.actor }}"

      # Activity 2: only update the page when I am the one who pushed
      - name: Update index.html
        if: github.actor == 'competeV'
        run: |
          sed -i '/<\/body>/i <p>Updated by ${{ github.actor }} on '"$(date)"'</p>' index.html

      # Activity 3: add a log line to the README
      - name: Update README log
        run: |
          echo "" >> README.md
          echo "### Updated by ${{ github.actor }} on $(date '+%Y-%m-%d %H:%M:%S') [Commit: $(git rev-parse --short HEAD)]" >> README.md

      # Activity 4: commit the changes back to the repository
      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Workflow: Updated HTML and README for ${{ github.actor }}" || echo "No changes to commit"
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
